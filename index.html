<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Rotación, Potreros y Mantenimiento</title>
    <!-- Estilo inspirado en Google Sheets + 3D Moderno y Limpio -->
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --accent: #14b8a6;
            --bg-color: #f1f5f9;
            --sheet-border: #cbd5e1;
            --text-main: #1e293b;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #115e59, #0f766e);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
        }

        /* Panel de Control unificado y simplificado */
        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 15px;
            border-top: 4px solid var(--accent);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
            align-items: flex-end;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--sheet-border);
            border-radius: 8px;
            font-size: 0.95rem;
            background: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
        }

        .btn-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-top: 5px;
            border-top: 1px solid #e2e8f0;
            margin-top: 10px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(15, 118, 110, 0.2);
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        button.secondary {
            background-color: #475569;
            box-shadow: 0 4px 6px -1px rgba(71, 85, 105, 0.2);
        }
        button.secondary:hover {
            background-color: #334155;
        }

        /* Estilo Hoja de Cálculo Sincronizada (Tabla) */
        .sheet-container {
            background: white;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid var(--sheet-border);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #f1f5f9;
        }

        th {
            background-color: #f8fafc;
            color: #334155;
            font-weight: 600;
            border-bottom: 2px solid var(--sheet-border);
        }

        tr:hover {
            background-color: #f8fafc;
        }

        /* Log minimalista y ordenado */
        .log-box {
            background: #0f172a;
            color: #38bdf8;
            padding: 12px 18px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 110px;
            overflow-y: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

        .log-entry {
            margin-bottom: 3px;
        }

        @media (max-width: 768px) {
            body { padding: 8px; }
            header { padding: 12px 15px; }
            .control-panel { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Encabezado Limpio -->
        <header>
            <h1>🌾 Control de Rotación y Mantenimiento de Potreros</h1>
            <div class="status-badge">🟢 Sistema Local Activo</div>
        </header>

        <!-- Formulario Simplificado y Sincronizado -->
        <div class="control-panel">
            <h3 style="margin-bottom: 12px; color: var(--primary); font-size: 1.05rem; font-weight: 600;">📝 Registro Rápido de Campo</h3>
            <form id="rotacion-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="potrero-select">Potrero (Seleccionar o Nuevo)</label>
                        <select id="potrero-select" onchange="verificarNuevoPotrero(this.value)" required>
                            <!-- Se carga dinámicamente -->
                        </select>
                    </div>

                    <!-- Input dinámico que aparece limpiamente al elegir nuevo -->
                    <div class="form-group" id="nuevo-potrero-group" style="display: none;">
                        <label for="potrero-nuevo">Nombre / Código del Nuevo Potrero</label>
                        <input type="text" id="potrero-nuevo" placeholder="Ej. Potrero 05">
                    </div>

                    <div class="form-group">
                        <label for="area">Área (Hectáreas / m²)</label>
                        <input type="text" id="area" placeholder="Ej. 3.5 Ha" required>
                    </div>

                    <div class="form-group">
                        <label for="lote">Lote de Animales</label>
                        <input type="text" id="lote" placeholder="Ej. Vacas de Leche" required>
                    </div>

                    <div class="form-group">
                        <label for="rotacion">Acción, Rotación y Mantenimiento</label>
                        <select id="rotacion" required>
                            <option value="Entrada a Ocupación">Entrada a Ocupación</option>
                            <option value="Salida a Descanso">Salida a Descanso</option>
                            <option value="Mantenimiento con Tractor">Mantenimiento con Tractor (Maquinaria)</option>
                            <option value="Mantenimiento con Personas">Mantenimiento con Personas (Manual)</option>
                            <option value="Fertilización / Riego">Fertilización / Riego</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="tareas">Tarea Específica / Observación</label>
                        <input type="text" id="tareas" placeholder="Ej. Limpieza de bebederos o chapeo">
                    </div>
                </div>

                <div class="btn-container">
                    <button type="submit">➕ Registrar en la Hoja</button>
                    <button type="button" class="secondary" onclick="exportarCSV()">📁 Exportar Archivo (CSV)</button>
                    <button type="button" class="secondary" onclick="limpiarDatos()" style="background-color: #b91c1c;">🗑️ Borrar Todo</button>
                </div>
            </form>
        </div>

        <!-- Vista de Tabla Tipo Hoja de Cálculo Sincronizada -->
        <div class="sheet-container">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>N° Potrero</th>
                            <th>Área</th>
                            <th>Lote</th>
                            <th>Acción, Rotación y Mantenimiento</th>
                            <th>Tarea Realizada</th>
                            <th style="text-align: center;">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-registros">
                        <!-- Los datos se cargan dinámicamente aquí -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Ventana de Logs Compacta -->
        <div class="log-box" id="log-box">
            <div class="log-entry">[Sistema] Interfaz simplificada y sincronizada correctamente en modo local.</div>
        </div>
    </div>

    <script>
        // Registro en Log
        function addLog(message) {
            const logBox = document.getElementById('log-box');
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div class="log-entry">[${time}] ${message}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Cargar fecha actual por defecto
        document.getElementById('fecha').valueAsDate = new Date();

        // Obtener lista única de potreros guardados en la memoria
        function obtenerPotrerosGuardados() {
            let registros = JSON.parse(localStorage.getItem('registros_potreros_v4')) || [];
            let potrerosMap = {};
            
            registros.forEach(r => {
                potrerosMap[r.potrero] = r.area;
            });
            
            return potrerosMap;
        }

        // Actualizar el menú desplegable del formulario de manera sincronizada
        function actualizarSelectorPotreros() {
            let select = document.getElementById('potrero-select');
            let potrerosMap = obtenerPotrerosGuardados();
            let potrerosKeys = Object.keys(potrerosMap);
            let valorActual = select.value;

            select.innerHTML = '';

            if (potrerosKeys.length === 0) {
                select.innerHTML = `<option value="NUEVO">➕ Escribir nuevo potrero...</option>`;
                document.getElementById('nuevo-potrero-group').style.display = 'block';
                document.getElementById('potrero-nuevo').required = true;
            } else {
                potrerosKeys.forEach(p => {
                    let opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = `${p} (Área: ${potrerosMap[p]})`;
                    select.appendChild(opt);
                });
                let optNuevo = document.createElement('option');
                optNuevo.value = "NUEVO";
                optNuevo.textContent = "➕ Agregar otro potrero...";
                select.appendChild(optNuevo);

                if (potrerosKeys.includes(valorActual)) {
                    select.value = valorActual;
                }

                if (select.value !== "NUEVO") {
                    document.getElementById('nuevo-potrero-group').style.display = 'none';
                    document.getElementById('potrero-nuevo').required = false;
                    autoCompletarArea(select.value);
                }
            }
        }

        function verificarNuevoPotrero(valor) {
            let grupoNuevo = document.getElementById('nuevo-potrero-group');
            let inputNuevo = document.getElementById('potrero-nuevo');
            if (valor === "NUEVO") {
                grupoNuevo.style.display = 'block';
                inputNuevo.required = true;
                inputNuevo.value = '';
                document.getElementById('area').value = '';
            } else {
                grupoNuevo.style.display = 'none';
                inputNuevo.required = false;
                autoCompletarArea(valor);
            }
        }

        function autoCompletarArea(nombrePotrero) {
            let potrerosMap = obtenerPotrerosGuardados();
            if (potrerosMap[nombrePotrero]) {
                document.getElementById('area').value = potrerosMap[nombrePotrero];
            }
        }

        // Cargar y sincronizar la tabla de registros desde LocalStorage
        function cargarRegistros() {
            let registros = JSON.parse(localStorage.getItem('registros_potreros_v4')) || [];
            const tbody = document.getElementById('tabla-registros');
            tbody.innerHTML = '';

            if(registros.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: #94a3b8; padding: 20px;">No hay registros guardados aún. Complete el formulario superior.</td></tr>`;
            } else {
                registros.forEach((reg, index) => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${reg.fecha}</td>
                        <td><strong>${reg.potrero}</strong></td>
                        <td>${reg.area}</td>
                        <td>${reg.lote}</td>
                        <td><span style="padding: 4px 10px; border-radius: 6px; background: #ccfbf1; color: #115e59; font-weight: 500; font-size: 0.85rem;">${reg.rotacion}</span></td>
                        <td>${reg.tareas || 'Ninguna'}</td>
                        <td style="text-align: center;"><button onclick="eliminarRegistro(${index})" style="padding: 4px 10px; background: #ef4444; font-size: 0.8rem; box-shadow: none;">❌</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            actualizarSelectorPotreros();
        }

        // Guardar un nuevo registro sincronizado
        document.getElementById('rotacion-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let selectVal = document.getElementById('potrero-select').value;
            let nombrePotrero = (selectVal === "NUEVO") ? document.getElementById('potrero-nuevo').value.trim() : selectVal;

            let nuevoRegistro = {
                fecha: document.getElementById('fecha').value,
                potrero: nombrePotrero,
                area: document.getElementById('area').value.trim(),
                lote: document.getElementById('lote').value.trim(),
                rotacion: document.getElementById('rotacion').value,
                tareas: document.getElementById('tareas').value.trim()
            };

            let registros = JSON.parse(localStorage.getItem('registros_potreros_v4')) || [];
            registros.unshift(nuevoRegistro);
            localStorage.setItem('registros_potreros_v4', JSON.stringify(registros));

            addLog(`Registro guardado: Potrero ${nombrePotrero} | ${nuevoRegistro.rotacion}`);
            cargarRegistros();
            
            // Mantener fecha actual y limpiar campos específicos sin perder sincronía
            document.getElementById('tareas').value = '';
            if(selectVal === "NUEVO") {
                document.getElementById('potrero-nuevo').value = '';
                actualizarSelectorPotreros();
            }
        });

        // Eliminar registro individual y sincronizar
        function eliminarRegistro(index) {
            let registros = JSON.parse(localStorage.getItem('registros_potreros_v4')) || [];
            let eliminado = registros.splice(index, 1);
            localStorage.setItem('registros_potreros_v4', JSON.stringify(registros));
            addLog(`Registro eliminado: Potrero ${eliminado[0].potrero}`);
            cargarRegistros();
        }

        // Borrar toda la base de datos local
        function limpiarDatos() {
            if(confirm("¿Está seguro de borrar todos los registros y la memoria de potreros?")) {
                localStorage.removeItem('registros_potreros_v4');
                addLog("Memoria local borrada por el usuario.");
                cargarRegistros();
            }
        }

        // Exportar a CSV
        function exportarCSV() {
            let registros = JSON.parse(localStorage.getItem('registros_potreros_v4')) || [];
            if(registros.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Fecha,Potrero,Area,Lote,Accion_Rotacion_Mantenimiento,Tareas\n";
            registros.forEach(r => {
                csvContent += `"${r.fecha}","${r.potrero}","${r.area}","${r.lote}","${r.rotacion}","${r.tareas}"\n`;
            });

            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `rotacion_y_mantenimiento_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            addLog("Archivo CSV generado y descargado exitosamente.");
        }

        window.onload = cargarRegistros;
    </script>
</body>
</html>
